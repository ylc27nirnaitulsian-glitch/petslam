<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad3)"/>

  <!-- Brand / Tag Header -->
  <rect x="80" y="80" width="180" height="42" rx="21" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="170" y="106" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">THE ENGINE</text>
  <text x="1000" y="108" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="end">03 / 05</text>

  <!-- Headline -->
  <text x="80" y="230" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">FROM REAL PHOTO TO</text>
  <text x="80" y="305" fill="url(#cyanBlue)" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">60 FPS FIGHTER IN 3 SEC</text>

  <text x="80" y="375" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500">
    <tspan x="80" dy="0">No generic presets. Gemini multimodal vision inspects your</tspan>
    <tspan x="80" dy="38">pet's photograph to build a mathematically unique fighter.</tspan>
  </text>

  <!-- Visual Pipeline -->
  <g transform="translate(80, 480)">
    <!-- Step 1: Upload Card -->
    <rect width="280" height="340" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="20" y="20" width="240" height="180" rx="14" fill="#0F172A"/>
    <!-- Camera Icon -->
    <circle cx="140" cy="110" r="36" fill="#334155"/>
    <circle cx="140" cy="110" r="18" fill="#64748B"/>
    <text x="140" y="240" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">1. Real Photo</text>
    <text x="140" y="275" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Upload any smartphone</text>
    <text x="140" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">picture of your dog or cat</text>

    <!-- Arrow 1 -->
    <path d="M295 170 L325 170" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
    <polygon points="325,163 340,170 325,177" fill="#00F0FF"/>

    <!-- Step 2: AI Feature Extraction -->
    <g transform="translate(350, 0)">
      <rect width="280" height="340" rx="20" fill="#1E293B" stroke="#00F0FF" stroke-width="2"/>
      <rect x="20" y="20" width="240" height="180" rx="14" fill="#0B1329"/>
      <!-- Laser scan lines -->
      <line x1="30" y1="60" x2="250" y2="60" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
      <line x1="30" y1="110" x2="250" y2="110" stroke="#CCFF00" stroke-width="3"/>
      <line x1="30" y1="160" x2="250" y2="160" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
      <text x="140" y="240" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">2. AI Vision Scan</text>
      <text x="140" y="275" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Extracts coat hex colors,</text>
      <text x="140" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">ear types &amp; markings</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M645 170 L675 170" stroke="#CCFF00" stroke-width="4" stroke-linecap="round"/>
    <polygon points="675,163 690,170 675,177" fill="#CCFF00"/>

    <!-- Step 3: Combat Card Result -->
    <g transform="translate(700, 0)">
      <rect width="220" height="340" rx="20" fill="#172554" stroke="#CCFF00" stroke-width="2.5"/>
      <rect x="20" y="20" width="180" height="180" rx="14" fill="#0F172A"/>
      <circle cx="110" cy="100" r="50" fill="#1E3A8A" stroke="#CCFF00" stroke-width="2"/>
      <text x="110" y="108" fill="#CCFF00" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">620 CP</text>
      <text x="110" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">3. 60 FPS Fighter</text>
      <text x="110" y="275" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Custom stats &amp;</text>
      <text x="110" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Signature Move</text>
    </g>
  </g>

  <!-- Calibrated Stats Showcase -->
  <g transform="translate(80, 870)">
    <rect width="920" height="230" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Calibrated RPG Stat Profile</text>

    <!-- Stat Bars -->
    <g transform="translate(40, 85)">
      <text x="0" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Attack Power</text>
      <rect x="180" y="6" width="600" height="18" rx="9" fill="#0F172A"/>
      <rect x="180" y="6" width="510" height="18" rx="9" fill="#EF4444"/>
      <text x="800" y="22" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">85</text>

      <text x="0" y="62" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Armor / Defense</text>
      <rect x="180" y="46" width="600" height="18" rx="9" fill="#0F172A"/>
      <rect x="180" y="46" width="460" height="18" rx="9" fill="#3B82F6"/>
      <text x="800" y="62" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">76</text>

      <text x="0" y="102" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Agility &amp; Speed</text>
      <rect x="180" y="86" width="600" height="18" rx="9" fill="#0F172A"/>
      <rect x="180" y="86" width="540" height="18" rx="9" fill="#CCFF00"/>
      <text x="800" y="102" fill="#CCFF00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">92</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="80" y="1260" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">PET SLAM • AI Vision &amp; Stat Calibration</text>
  <text x="1000" y="1260" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="end">petslam.app</text>
</svg>
